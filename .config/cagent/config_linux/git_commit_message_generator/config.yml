#!/usr/bin/env cagent run
version: "2"

agents:
  root:
    model: agent2
    description: "General coding assistant. Create Git commit message with tag."
    instruction: !include ./prompt.md
    commands:
      git-commit-message: "Create Git commit message with tag. Don't use parentheses. git_dir=''"
      git-commit-message-staged: "Create Git commit message with tag. Don't use parentheses. git_dir='' staged_only=true"
      git-commit-message-pwd: "Create Git commit message with tag. Don't use parentheses. git_dir='.'"
      git-commit-message-staged-pwd: "Create Git commit message with tag. Don't use parentheses. git_dir='.' staged_only=true"
    toolsets:
      - type: mcp
        command: /home/user/devbox/pkg/bin/mcp/linux_amd64/devbox-mcp-tools
        args:
          - git_diff_recorder
        tools:
          - get_git_diff

models:
  agent1:
    provider: anthropic
    model: claude-sonnet-4-20250514
    max_tokens: 1024
    temperature: 0.2
  agent2:
    provider: dmr
    model: hf.co/Qwen/Qwen3-14B-GGUF:Q6_K
    max_tokens: 1024
  agent3:
    provider: dmr
    model: ai/qwen3:14B-Q6_K
    max_tokens: 1024
