version: 1.0.0
title: Code Analysis & Task Automation Recipe
description: A concise guide for leveraging Goose tools to analyze code structures and automate repetitive tasks across development workflows.
instructions: 'Use the ''analyze'' tool to examine code structure and dependencies, then delegate complex tasks to subagents via the ''delegate'' command. For UI-focused work, utilize the ''apps'' system to rapidly prototype and iterate on frontend components. Always follow the recommended workflow sequence: analyze → delegate → iterate, ensuring compatibility with the active toolset.'
extensions:
- type: platform
  name: analyze
  description: 'Analyze code structure with tree-sitter: directory overviews, file details, symbol call graphs'
  display_name: Analyze
  bundled: true
- type: platform
  name: summon
  description: Load knowledge and delegate tasks to subagents
  display_name: Summon
  bundled: true
- type: platform
  name: todo
  description: Enable a todo list for goose so it can keep track of what it is doing
  display_name: Todo
  bundled: true
- type: platform
  name: Extension Manager
  description: Enable extension management tools for discovering, enabling, and disabling extensions
  display_name: Extension Manager
  bundled: true
- type: builtin
  name: developer
  description: Write and edit files, and execute shell commands
  display_name: Developer
  timeout: null
  bundled: true
- type: platform
  name: apps
  description: Create and manage custom Goose apps through chat. Apps are HTML/CSS/JavaScript and run in sandboxed windows.
  display_name: Apps
  bundled: true
- type: platform
  name: tom
  description: Inject custom context into every turn via GOOSE_MOIM_MESSAGE_TEXT and GOOSE_MOIM_MESSAGE_FILE environment variables
  display_name: Top Of Mind
  bundled: true
- type: platform
  name: skills
  description: Discover and provide skill instructions from filesystem and builtins
  display_name: Skills
  bundled: true
settings:
  goose_provider: ollama
  goose_model: qwen3-vl:latest
  temperature: 0.0
activities:
- Analyze code dependencies
- Automate repetitive tasks
- Prototype UI components
- Trace call graphs
- Iterate app functionality
author:
  contact: landmaster135
