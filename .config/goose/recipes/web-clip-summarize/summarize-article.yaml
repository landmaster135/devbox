version: 1.0.0
title: "article-summarizer"
description: "指定したURLのWeb記事を取得して要約する"

parameters:
  - key: url
    input_type: string
    requirement: required
    description: "要約したい記事のURL"

extensions:
  - type: builtin
    name: computercontroller
  - type: platform
    name: skills
    description: "Discover and load local Agent Skills"
    display_name: Skills
    bundled: true
  - type: stdio
    name: web_clipper
    cmd: ./mcps/devbox-mcp-tools
    args:
      - web_clipper
    timeout: 300
    bundled: false
    description: "Web記事要約Markdownを出力する devbox MCP"
    available_tools:
      - patch_markdown

instructions: |
  あなたは指定されたURLの記事を取得し、正確かつ簡潔に日本語で要約するアシスタントです。

prompt: |
  次のURLの記事本文を取得してください: {{ url }}
  取得した内容をもとに、 web-clipping-summary skill を使って要約を作成してください。
