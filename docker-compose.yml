services:
  devbox:
    image: "devbox-cron:latest"
    restart: unless-stopped
    ports:
      - "9999:9999"
    environment:
      - GIN_MODE=staging
    volumes:
      - type: bind
        source: ""
        target: ""
    labels:
      tsdproxy.enable: "true"
      tsdproxy.name: "devbox"
      tsdproxy.container_port: 9999
