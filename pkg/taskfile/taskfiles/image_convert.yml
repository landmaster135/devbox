version: "3"

includes:
  core:
    taskfile: ./_core.yml
    internal: true

tasks:
  image-converter:jpg-to-webp:
    desc: "image-converterでJPGからWebPに変換"
    cmds:
      - cmd: |
          set -eu
          {{.INTERACTIVE_TEXT_INPUT_FUNC}} {{.INTERACTIVE_CONFIRM_INPUT_FUNC}}

          QUALITY_ARG="$({{.INTERACTIVE_TEXT_INPUT_NAME}} \
            "Input integer (80 as default) for quality of output webp (1-100): " q 80)" || exit 1

          MOVE_FLAG="$({{.INTERACTIVE_CONFIRM_INPUT_NAME}} \
            "Select whether to move original image files to archive directory or not  [y]='--move'  [n]='' : " move)" || exit 1
          ARCHIVE_DIR_ARG=""
          if [ -n "$MOVE_FLAG" ]; then
            ARCHIVE_DIR_ARG="--archive-dir=.{{.DIR_SEP}}5_original_files"
          fi

          echo $'\n[Step 01: START]--- Webp変換プログラムを実行します ---'
          "{{.CLI_BIN_DIR}}{{.DIR_SEP}}image-converter{{.EXE}}" \
            --src-dir=. --output-dir=.{{.DIR_SEP}}999_converted_images --ext=webp \
            $ARCHIVE_DIR_ARG $QUALITY_ARG $MOVE_FLAG
          echo $'\n[Step 01: END]--- Webp変換プログラムの実行が完了しました ---'
        dir: "{{.TASKFILE_DIR}}"
        interactive: true
        silent: true

  image-converter:jpg-to-webp:cwebp:
    desc: "image-converter-by-libwebpでJPGからWebPに変換"
    cmds:
      - cmd: |
          set -eu
          {{.INTERACTIVE_TEXT_INPUT_FUNC}} {{.INTERACTIVE_CONFIRM_INPUT_FUNC}}

          QUALITY_ARG="$({{.INTERACTIVE_TEXT_INPUT_NAME}} \
            "Input integer (99 as default) for quality of output webp (1-100): " q 99)" || exit 1

          MOVE_FLAG="$({{.INTERACTIVE_CONFIRM_INPUT_NAME}} \
            "Select whether to move original image files to archive directory or not  [y]='--move'  [n]='' : " move)" || exit 1

          echo $'\n[Step 01: START]--- cwebp Webp変換プログラムを実行します ---'
          "{{.CLI_BIN_DIR}}{{.DIR_SEP}}image-converter-by-libwebp{{.EXE}}" \
            --src-dir=. --out-dir=.{{.DIR_SEP}}999_converted_images \
            --archive-dir="" \
            --ext=webp \
            --m=6 \
            $QUALITY_ARG $MOVE_FLAG
          echo $'\n[Step 01: END]--- cwebp Webp変換プログラムの実行が完了しました ---'
        dir: "{{.TASKFILE_DIR}}"
        interactive: true
        silent: true

  image-converter:png-to-webp:
    desc: "image-converterでPNGからWebPに変換"
    cmds:
      - cmd: |
          set -eu
          {{.INTERACTIVE_TEXT_INPUT_FUNC}} {{.INTERACTIVE_CONFIRM_INPUT_FUNC}}

          QUALITY_ARG="$({{.INTERACTIVE_TEXT_INPUT_NAME}} \
            "Input integer (80 as default) for quality of output webp (1-100): " q 80)" || exit 1

          MOVE_FLAG="$({{.INTERACTIVE_CONFIRM_INPUT_NAME}} \
            "Select whether to move original image files to archive directory or not  [y]='--move'  [n]='' : " move)" || exit 1
          ARCHIVE_DIR_ARG=""
          if [ -n "$MOVE_FLAG" ]; then
            ARCHIVE_DIR_ARG="--archive-dir=.{{.DIR_SEP}}5_original_files"
          fi

          echo $'\n[Step 01: START]--- Webp変換プログラムを実行します ---'
          "{{.CLI_BIN_DIR}}{{.DIR_SEP}}image-converter{{.EXE}}" \
            --src-dir=. --output-dir=.{{.DIR_SEP}}999_converted_images --ext=webp \
            $ARCHIVE_DIR_ARG $QUALITY_ARG $MOVE_FLAG
          echo $'\n[Step 01: END]--- Webp変換プログラムの実行が完了しました ---'
        dir: "{{.TASKFILE_DIR}}"
        interactive: true
        silent: true

  image-converter:png-to-webp:cwebp:
    desc: "image-converter-by-libwebpでPNGからWebPに変換"
    cmds:
      - cmd: |
          set -eu
          {{.INTERACTIVE_TEXT_INPUT_FUNC}} {{.INTERACTIVE_CONFIRM_INPUT_FUNC}}

          QUALITY_ARG="$({{.INTERACTIVE_TEXT_INPUT_NAME}} \
            "Input integer (99 as default) for quality of output webp (1-100): " q 99)" || exit 1

          MOVE_FLAG="$({{.INTERACTIVE_CONFIRM_INPUT_NAME}} \
            "Select whether to move original image files to archive directory or not  [y]='--move'  [n]='' : " move)" || exit 1

          echo $'\n[Step 01: START]--- cwebp Webp変換プログラムを実行します ---'
          "{{.CLI_BIN_DIR}}{{.DIR_SEP}}image-converter-by-libwebp{{.EXE}}" \
            --src-dir=. --out-dir=.{{.DIR_SEP}}999_converted_images \
            --archive-dir="" \
            --ext=webp \
            --m=6 \
            $QUALITY_ARG $MOVE_FLAG
          echo $'\n[Step 01: END]--- cwebp Webp変換プログラムの実行が完了しました ---'
        dir: "{{.TASKFILE_DIR}}"
        interactive: true
        silent: true

  image-converter:png-to-webp:keeping-saturation:
    desc: "image-converterでPNGからWebP(lossless)に変換"
    cmds:
      - cmd: |
          set -eu
          {{.INTERACTIVE_CONFIRM_INPUT_FUNC}}

          MOVE_FLAG="$({{.INTERACTIVE_CONFIRM_INPUT_NAME}} \
            "Select whether to move original image files to archive directory or not  [y]='--move'  [n]='' : " move)" || exit 1

          echo $'\n[Step 01: START]--- Webp(lossless)変換プログラムを実行します ---'
          "{{.CLI_BIN_DIR}}{{.DIR_SEP}}image-converter{{.EXE}}" \
            --src-dir=. --output-dir=.{{.DIR_SEP}}999_converted_images --ext=webp --q=80 --lossless \
            --archive-dir=.{{.DIR_SEP}}5_original_files \
            $MOVE_FLAG
          echo $'\n[Step 01: END]--- Webp(lossless)変換プログラムの実行が完了しました ---'
        dir: "{{.TASKFILE_DIR}}"
        interactive: true
        silent: true

  image-converter:to-jpg:
    desc: "image-converterでJPGへ変換"
    cmds:
      - cmd: |
          set -eu
          {{.INTERACTIVE_TEXT_INPUT_FUNC}} {{.INTERACTIVE_CONFIRM_INPUT_FUNC}}

          QUALITY_ARG="$({{.INTERACTIVE_TEXT_INPUT_NAME}} \
            "Input integer (75 as default) for quality of output jpg (1-100): " q)" || exit 1

          MOVE_FLAG="$({{.INTERACTIVE_CONFIRM_INPUT_NAME}} \
            "Select whether to move original image files to archive directory or not  [y]='--move'  [n]='' : " move)" || exit 1

          echo $'\n[Step 01: START]--- JPG変換プログラムを実行します ---'
          "{{.CLI_BIN_DIR}}{{.DIR_SEP}}image-converter{{.EXE}}" \
            --src-dir=. --output-dir=.{{.DIR_SEP}}999_converted_images --ext=jpg \
            --archive-dir=.{{.DIR_SEP}}5_original_files \
            $QUALITY_ARG $MOVE_FLAG
          echo $'\n[Step 01: END]--- JPG変換プログラムの実行が完了しました ---'
        dir: "{{.TASKFILE_DIR}}"
        interactive: true
        silent: true

  image-rotator:rotate:
    desc: "image-rotatorで画像を回転"
    cmds:
      - cmd: |
          set -eu
          {{.INTERACTIVE_CHOICE_FLAG_INPUT_FUNC}} {{.INTERACTIVE_CONFIRM_INPUT_FUNC}} {{.METHOD_FLAG_GUARD_FUNC}}

          ANGLE_FLAG="$({{.INTERACTIVE_CHOICE_FLAG_INPUT_NAME}} \
            "Select which to rotate image files to rotate  [a]='right-90'  [b]='left-90'  [c]='180' : " \
            --choice-option "a|-angle=90" --choice-option "b|-angle=270" --choice-option "c|-angle=180")" || exit 1

          MOVE_FLAG="$({{.INTERACTIVE_CONFIRM_INPUT_NAME}} \
            "Select whether to move original image files to archive directory or not  [y]='--move'  [n]='' : " move)" || exit 1

          echo $'\n[Step 01: START]--- 画像回転プログラムを実行します ---'
          "{{.CLI_BIN_DIR}}{{.DIR_SEP}}image-rotator{{.EXE}}" \
            --src=. --suffix=rotated \
            "$ANGLE_FLAG" $MOVE_FLAG
          echo $'\n[Step 01: END]--- 画像回転プログラムの実行が完了しました ---'
        dir: "{{.TASKFILE_DIR}}"
        interactive: true
        silent: true

  image-trim-describer:describe:
    desc: "image-trim-describerで座標確認"
    cmds:
      - cmd: |
          set -eu

          echo $'\n[Step 01: START]--- image-trim-describerを起動します ---'
          "{{.CLI_BIN_DIR}}{{.DIR_SEP}}image-trim-describer{{.EXE}}"
          echo $'\n[Step 01: END]--- image-trim-describerの実行が完了しました ---'
        dir: "{{.TASKFILE_DIR}}"
        silent: true

  image-trimmer:trim-by-coordinates:
    desc: "image-trimmerで座標指定トリミング"
    cmds:
      - cmd: |
          set -eu
          {{.INTERACTIVE_MAP_INPUT_FUNC}} {{.INTERACTIVE_CONFIRM_INPUT_FUNC}} {{.METHOD_FLAG_GUARD_FUNC}}

          COORDINATE_ARGS="$({{.INTERACTIVE_MAP_INPUT_NAME}} \
            "Input coordinates (e.g. -x1 244 -y1 269 -x2 2140 -y2 1090): " coords)" || exit 1

          {{.METHOD_FLAG_GUARD_NAME}} "interactive-input からトリミング座標を取得できませんでした。" "$COORDINATE_ARGS"

          MOVE_FLAG="$({{.INTERACTIVE_CONFIRM_INPUT_NAME}} \
            "Select whether to move original image files to archive directory or not  [y]='--move'  [n]='' : " move)" || exit 1

          echo $'\n[Step 01: START]--- 座標指定トリミングを実行します ---'
          "{{.CLI_BIN_DIR}}{{.DIR_SEP}}image-trimmer{{.EXE}}" \
            --src-dir=. --output-dir=.{{.DIR_SEP}}999_converted_images --suffix=cropped \
            $COORDINATE_ARGS $MOVE_FLAG
          echo $'\n[Step 01: END]--- 座標指定トリミングの実行が完了しました ---'
        dir: "{{.TASKFILE_DIR}}"
        interactive: true
        silent: true

  image-trimmer:trim-by-purpose:
    desc: "image-trimmerで用途別プリセットトリミング"
    cmds:
      - cmd: |
          set -eu
          {{.INTERACTIVE_CHOICE_FLAG_INPUT_FUNC}} {{.INTERACTIVE_CONFIRM_INPUT_FUNC}}

          PURPOSE="$({{.INTERACTIVE_CHOICE_FLAG_INPUT_NAME}} \
            "Select how to trim images by purpose taking screenshots  [g]='General'  [c]='Comic' : " \
            --choice-option "g|general" --choice-option "c|comic")" || exit 1

          case "$PURPOSE" in
            general)
              X1_ARG="--x1=0"
              Y1_ARG="--y1=131"
              X2_ARG="--x2=1080"
              Y2_ARG="--y2=2293"
              ;;
            comic)
              X1_ARG="--x1=0"
              Y1_ARG="--y1=341"
              X2_ARG="--x2=1080"
              Y2_ARG="--y2=2056"
              ;;
            *)
              echo "Invalid purpose is selected." >&2
              exit 1
              ;;
          esac

          MOVE_FLAG="$({{.INTERACTIVE_CONFIRM_INPUT_NAME}} \
            "Select whether to move original image files to archive directory or not  [y]='--move'  [n]='' : " move)" || exit 1

          echo $'\n[Step 01: START]--- 用途別プリセットトリミングを実行します ---'
          "{{.CLI_BIN_DIR}}{{.DIR_SEP}}image-trimmer{{.EXE}}" \
            --src-dir=. --output-dir=.{{.DIR_SEP}}999_converted_images --suffix=cropped \
            "$X1_ARG" "$Y1_ARG" "$X2_ARG" "$Y2_ARG" $MOVE_FLAG
          echo $'\n[Step 01: END]--- 用途別プリセットトリミングの実行が完了しました ---'
        dir: "{{.TASKFILE_DIR}}"
        interactive: true
        silent: true

  image-filterer:blur:
    desc: "image-filtererで任意座標のぼかし処理"
    cmds:
      - cmd: |
          set -eu
          {{.INTERACTIVE_MAP_INPUT_FUNC}} {{.INTERACTIVE_TEXT_INPUT_FUNC}} {{.INTERACTIVE_CONFIRM_INPUT_FUNC}} {{.METHOD_FLAG_GUARD_FUNC}}

          COORDINATE_ARGS="$({{.INTERACTIVE_MAP_INPUT_NAME}} \
            "Input 4 coordinates linked on each parameter to trim images (-x1, -y1, -x2, -y2): " coordinates)" || exit 1

          {{.METHOD_FLAG_GUARD_NAME}} "interactive-input からぼかし対象座標を取得できませんでした。" "$COORDINATE_ARGS"

          RADIUS_ARG="$({{.INTERACTIVE_TEXT_INPUT_NAME}} \
            "Input radius for blurring strength (default: 50, recommended -> 1920x1080px: 50, 4080x3072px: 300): " radius)" || exit 1

          {{.METHOD_FLAG_GUARD_NAME}} "interactive-input からぼかし半径を取得できませんでした。" "$RADIUS_ARG"

          MOVE_FLAG="$({{.INTERACTIVE_CONFIRM_INPUT_NAME}} \
            "Select whether to move original image files to archive directory or not  [y]='--move'  [n]='' : " move)" || exit 1

          echo $'\n[Step 01: START]--- 画像フィルタリング(blur)を実行します ---'
          "{{.CLI_BIN_DIR}}{{.DIR_SEP}}image-filterer{{.EXE}}" \
            --src=. --suffix=blurred --mode=blur \
            $COORDINATE_ARGS $MOVE_FLAG $RADIUS_ARG
          echo $'\n[Step 01: END]--- 画像フィルタリング(blur)の実行が完了しました ---'
        dir: "{{.TASKFILE_DIR}}"
        interactive: true
        silent: true

  image-filterer:blur-for-genshin-captures:
    desc: "image-filtererで原神スクショ向けぼかし処理"
    cmds:
      - cmd: |
          set -eu
          {{.INTERACTIVE_CONFIRM_INPUT_FUNC}}

          MOVE_FLAG="$({{.INTERACTIVE_CONFIRM_INPUT_NAME}} \
            "Select whether to move original image files to archive directory or not  [y]='--move'  [n]='' : " move)" || exit 1

          echo $'\n[Step 01: START]--- 原神スクショ向けのぼかしプリセットを実行します ---'
          "{{.CLI_BIN_DIR}}{{.DIR_SEP}}image-filterer{{.EXE}}" \
            --src=. --suffix=blurred \
            --mode=blur --radius=50 \
            --x1=2246 --y1=1398 --x2=2487 --y2=1440 \
            $MOVE_FLAG
          echo $'\n[Step 01: END]--- 原神スクショ向けのぼかしプリセットの実行が完了しました ---'
        dir: "{{.TASKFILE_DIR}}"
        interactive: true
        silent: true
