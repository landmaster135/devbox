version: "3"

vars:
  DIR_SEP: '{{if eq OS "windows"}}\\{{else}}/{{end}}'
  EXE: '{{if eq OS "windows"}}.exe{{else}}{{end}}'
  OS_ARCH: '{{if eq OS "windows"}}win_amd64{{else}}{{if eq OS "linux"}}linux_amd64{{else}}darwin_arm64{{end}}{{end}}'
  CLI_BIN_DIR: "{{.TASKFILE_DIR}}{{.DIR_SEP}}..{{.DIR_SEP}}pkg{{.DIR_SEP}}bin{{.DIR_SEP}}cli{{.DIR_SEP}}{{.OS_ARCH}}"
  INTERACTIVE_BIN: "{{.CLI_BIN_DIR}}{{.DIR_SEP}}interactive-input{{.EXE}}"
  INTERACTIVE_TEXT_INPUT_NAME: input_text_interactively
  INTERACTIVE_TEXT_INPUT_FUNC: |
    function {{.INTERACTIVE_TEXT_INPUT_NAME}}() {
      local prompt="$1"; local key="$2";
      local value;
      if ! value="$("{{.INTERACTIVE_BIN}}" \
        --prompt "$prompt" --input-type text --key "$key")"; then
        return 1;
      fi; printf '%s\n' "$value";
    }
  INTERACTIVE_MAP_INPUT_NAME: input_map_interactively
  INTERACTIVE_MAP_INPUT_FUNC: |
    function {{.INTERACTIVE_MAP_INPUT_NAME}}() {
      local prompt="$1"; local _key="$2";
      local value;
      if ! value="$("{{.INTERACTIVE_BIN}}" \
        --prompt "$prompt" --input-type map)"; then
        return 1;
      fi; printf '%s\n' "$value";
    }
  INTERACTIVE_CONFIRM_INPUT_NAME: input_confirm_interactively
  INTERACTIVE_CONFIRM_INPUT_FUNC: |
    function {{.INTERACTIVE_CONFIRM_INPUT_NAME}}() {
      local prompt="$1"; local key="$2";
      local value;
      if ! value="$("{{.INTERACTIVE_BIN}}" \
        --prompt "$prompt" --input-type confirm --key "$key")"; then
        return 1;
      fi; printf '%s\n' "$value";
    }
  INTERACTIVE_CHOICE_INPUT_NAME: input_choice_interactively
  INTERACTIVE_CHOICE_INPUT_FUNC: |
    function {{.INTERACTIVE_CHOICE_INPUT_NAME}}() {
      local prompt="$1"; local key="$2"; shift 2 || return 1;
      local value;
      if ! value="$("{{.INTERACTIVE_BIN}}" \
        --prompt "$prompt" --input-type choice --key "$key" "$@")"; then
        return 1;
      fi; printf '%s\n' "$value";
    }
  INTERACTIVE_CHOICE_FLAG_INPUT_NAME: input_choice_flag_interactively
  INTERACTIVE_CHOICE_FLAG_INPUT_FUNC: |
    function {{.INTERACTIVE_CHOICE_FLAG_INPUT_NAME}}() {
      local prompt="$1"; shift 1 || return 1;
      local value;
      if ! value="$("{{.INTERACTIVE_BIN}}" \
        --prompt "$prompt" --input-type choice-flag "$@")"; then
        return 1;
      fi; printf '%s\n' "$value";
    }
  METHOD_FLAG_GUARD_NAME: ensure_method_flag
  METHOD_FLAG_GUARD_FUNC: |
    function {{.METHOD_FLAG_GUARD_NAME}}() {
      local error_message="$1"; shift 1 || true;
      if [ "$#" -eq 0 ]; then
        echo "${error_message}" >&2; exit 1;
      fi; local flag;
      for flag in "$@"; do
        if [ -z "$flag" ]; then
          echo "${error_message}" >&2; exit 1;
        fi
      done
    }
