version: "3"

includes:
  core:
    taskfile: ./core.yml
    internal: true

tasks:
  image-renamer:habit:
    desc: "image-renamer-for-contentでHB画像にリネーム"
    cmds:
      - cmd: |
          set -eu
          {{.INTERACTIVE_TEXT_INPUT_FUNC}} {{.INTERACTIVE_CHOICE_FLAG_INPUT_FUNC}} {{.METHOD_FLAG_GUARD_FUNC}}

          START_ARG="$({{.INTERACTIVE_TEXT_INPUT_NAME}} "Input start of number for content of habit (HBxxxxxxxxx_01.webp): " start)" || exit 1
          SORT_FLAG="$({{.INTERACTIVE_CHOICE_FLAG_INPUT_NAME}} \
            "Select how to sort image files to rename  [n]='-name'  [t]='-time' : " \
            --choice-option "n|-name" --choice-option "t|-time")" || exit 1

          {{.METHOD_FLAG_GUARD_NAME}} "interactive-input から値を取得できませんでした。" "$START_ARG" "$SORT_FLAG"

          echo $'\n[Step 01: START]: --- 画像リネームプログラムを実行します ---'
          "{{.CLI_BIN_DIR}}{{.DIR_SEP}}image-renamer-for-content{{.EXE}}" \
            --src=. --operation=habit \
            --delimiter="" --suffix="" \
            "$START_ARG" "$SORT_FLAG"
          echo $'\n[Step 01: END]: --- 画像リネームプログラムの実行が完了しました ---'
        dir: "{{.TASKFILE_DIR}}"
        interactive: true
        silent: true

