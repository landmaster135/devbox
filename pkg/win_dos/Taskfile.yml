version: "3"

vars:
  DIR_SEP: '{{if eq OS "windows"}}\\{{else}}/{{end}}'
  CLI_BIN_DIR: "{{.TASKFILE_DIR}}{{.DIR_SEP}}pkg{{.DIR_SEP}}bin{{.DIR_SEP}}cli{{.DIR_SEP}}win_amd64"
  INTERACTIVE_BIN: "{{.CLI_BIN_DIR}}{{.DIR_SEP}}interactive-input.exe"
  INTERACTIVE_TEXT_INPUT: |
    function input_text_interactively() {
      local prompt="$1"; local key="$2";
      local value;
      if ! value="$("{{.INTERACTIVE_BIN}}" \
        --prompt "$prompt" --input-type text --key "$key")"; then
        return 1;
      fi; printf '%s\n' "$value";
    }
  INTERACTIVE_CHOICE_INPUT: |
    function input_choice_interactively() {
      local prompt="$1"; local key="$2";
      shift 2 || return 1;
      local value;
      if ! value="$("{{.INTERACTIVE_BIN}}" \
        --prompt "$prompt" --input-type choice --key "$key" "$@")"; then
        return 1;
      fi; printf '%s\n' "$value";
    }
  INTERACTIVE_CHOICE_FLAG_INPUT: |
    function input_choice_flag_interactively() {
      local prompt="$1";
      shift 1 || return 1;
      local value;
      if ! value="$("{{.INTERACTIVE_BIN}}" \
        --prompt "$prompt" --input-type choice-flag "$@")"; then
        return 1;
      fi; printf '%s\n' "$value";
    }
  INTERACTIVE_CONFIRM_INPUT: |
    function input_confirm_interactively() {
      local prompt="$1"; local key="$2";
      local value;
      if ! value="$("{{.INTERACTIVE_BIN}}" \
        --prompt "$prompt" --input-type confirm --key "$key")"; then
        return 1;
      fi; printf '%s\n' "$value";
    }

tasks:
  image-renamer:habit:
    desc: "image-renamer-for-content.exeでHB画像にリネーム"
    cmds:
      - cmd: |
          set -eu

          {{.INTERACTIVE_TEXT_INPUT}}
          {{.INTERACTIVE_CHOICE_FLAG_INPUT}}

          START_ARG="$(input_text_interactively "Input start of number for content of habit (HBxxxxxxxxx_01.webp): " start)" || exit 1

          SORT_FLAG="$(input_choice_flag_interactively \
            "Select how to sort image files to rename  [n]='-name'  [t]='-time' : " \
            --choice-option "n|-name" --choice-option "t|-time")" || exit 1

          if [ -z "$START_ARG" ] || [ -z "$SORT_FLAG" ]; then
            echo "interactive-input から値を取得できませんでした。" >&2
            exit 1
          fi

          echo $'\n[Step 01: START]: --- 画像リネームプログラムを実行します ---'
          "{{.CLI_BIN_DIR}}{{.DIR_SEP}}image-renamer-for-content.exe" \
            --src . --operation habit \
            --delimiter "" --suffix "" \
            "$START_ARG" "$SORT_FLAG"
          echo $'\n[Step 01: END]: --- 画像リネームプログラムの実行が完了しました ---'
        dir: "{{.TASKFILE_DIR}}"
        interactive: true
        silent: true

  image-renamer:date:
    desc: "image-renamer-for-content.exeでDA画像にリネーム"
    cmds:
      - cmd: |
          set -eu

          {{.INTERACTIVE_TEXT_INPUT}}
          {{.INTERACTIVE_CHOICE_FLAG_INPUT}}

          START_ARG="$(input_text_interactively "Input start of number for content of date (DAxxxxx_01.webp): " start)" || exit 1

          SORT_FLAG="$(input_choice_flag_interactively \
            "Select how to sort image files to rename  [n]='-name'  [t]='-time' : " \
            --choice-option "n|-name" --choice-option "t|-time")" || exit 1

          if [ -z "$START_ARG" ] || [ -z "$SORT_FLAG" ]; then
            echo "interactive-input から値を取得できませんでした。" >&2
            exit 1
          fi

          echo $'\n[Step 01: START]: --- 画像リネームプログラムを実行します ---'
          "{{.CLI_BIN_DIR}}{{.DIR_SEP}}image-renamer-for-content.exe" \
            --src . --operation date \
            --delimiter "" --suffix "" \
            "$START_ARG" "$SORT_FLAG"
          echo $'\n[Step 01: END]: --- 画像リネームプログラムの実行が完了しました ---'
        dir: "{{.TASKFILE_DIR}}"
        interactive: true
        silent: true

  image-renamer:mackerel:
    desc: "image-renamer-for-content.exeでMA画像にリネーム"
    cmds:
      - cmd: |
          set -eu

          {{.INTERACTIVE_TEXT_INPUT}}
          {{.INTERACTIVE_CHOICE_FLAG_INPUT}}

          START_ARG="$(input_text_interactively "Input start of number for content of mackerel (MAxxxx_01.webp): " start)" || exit 1

          SORT_FLAG="$(input_choice_flag_interactively \
            "Select how to sort image files to rename  [n]='-name'  [t]='-time' : " \
            --choice-option "n|-name" --choice-option "t|-time")" || exit 1

          if [ -z "$START_ARG" ] || [ -z "$SORT_FLAG" ]; then
            echo "interactive-input から値を取得できませんでした。" >&2
            exit 1
          fi

          echo $'\n[Step 01: START]: --- 画像リネームプログラムを実行します ---'
          "{{.CLI_BIN_DIR}}{{.DIR_SEP}}image-renamer-for-content.exe" \
            --src . --operation mackerel \
            --delimiter "" --suffix "" \
            "$START_ARG" "$SORT_FLAG"
          echo $'\n[Step 01: END]: --- 画像リネームプログラムの実行が完了しました ---'
        dir: "{{.TASKFILE_DIR}}"
        interactive: true
        silent: true

  screenshot:rename-convert:
    desc: "スクショの命名＋WebP変換 (image-renamer-for-screenshot.exe + image-converter.exe)"
    cmds:
      - cmd: |
          set -eu

          {{.INTERACTIVE_CHOICE_INPUT}}
          {{.INTERACTIVE_CONFIRM_INPUT}}

          METHOD_FLAG="$(input_choice_interactively \
            "Select how to rename image files  [v]='vlc'  [w]='win'  [x]='xiaomi'  [p]='pixel (screen_record)' : " operation \
            --choice-option "v|vlc" --choice-option "w|win" --choice-option "x|xiaomi" --choice-option "p|pixel")" || exit 1

          if [ -z "$METHOD_FLAG" ]; then
            echo "interactive-input からリネーム方法を取得できませんでした。" >&2
            exit 1
          fi

          MOVE_FLAG="$(input_confirm_interactively \
            "Select whether to move original image files to archive directory or not  [y]='--move'  [n]='' : " move)" || exit 1

          echo $'\n[Step 01: START]--- 画像リネームプログラムを実行します ---'
          "{{.CLI_BIN_DIR}}{{.DIR_SEP}}image-renamer-for-screenshot.exe" -src . "${METHOD_FLAG}"
          echo $'\n[Step 01: END]--- 画像リネームプログラムの実行が完了しました ---'

          echo $'\n[Step 02: START]--- Webp変換プログラムを実行します ---'
          "{{.CLI_BIN_DIR}}{{.DIR_SEP}}image-converter.exe" \
            --src . --ext webp \
            --q 80  --archive .{{.DIR_SEP}}5_original_files \
            $MOVE_FLAG
          echo $'\n[Step 02: END]--- Webp変換プログラムの実行が完了しました ---'
        dir: "{{.TASKFILE_DIR}}"
        interactive: true
        silent: true
