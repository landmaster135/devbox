version: "3"

includes:
  calc:
    taskfile: ./Taskfile.calculate_for_text.yml
    flatten: false
    internal: true
  image-convert:
    taskfile: ./Taskfile.image_convert.yml
    flatten: false
    internal: true
  image-rename:
    taskfile: ./Taskfile.image_rename.yml
    flatten: false
    internal: true
  synthetic:
    taskfile: ./Taskfile.synthetic.yml
    flatten: false
    internal: true

tasks:
  arithmetic-calculator:extract-api-cost:
    desc: "arithmetic-calculatorでAPIコストを抽出"
    cmds:
      - task: calc:arithmetic-calculator:extract-api-cost

  datetime-calculator:extract-working-time:
    desc: "datetime-calculatorで作業時間を抽出"
    cmds:
      - task: calc:datetime-calculator:extract-working-time

  datetime-calculator:generate-daily-heading:
    desc: "datetime-calculatorで日次見出しを出力"
    cmds:
      - task: calc:datetime-calculator:generate-daily-heading

  image-renamer:habit:
    desc: "image-renamer-for-contentでHB画像にリネーム"
    cmds:
      - task: image-rename:image-renamer:habit

  image-renamer:date:
    desc: "image-renamer-for-contentでDA画像にリネーム"
    cmds:
      - task: image-rename:image-renamer:date

  image-renamer:mackerel:
    desc: "image-renamer-for-contentでMA画像にリネーム"
    cmds:
      - task: image-rename:image-renamer:mackerel

  image-renamer:anime:
    desc: "image-renamer-for-contentでAN画像にリネーム"
    cmds:
      - task: image-rename:image-renamer:anime

  image-renamer:comic:
    desc: "image-renamer-for-contentでCM画像にリネーム"
    cmds:
      - task: image-rename:image-renamer:comic

  image-renamer:web-clip:
    desc: "image-renamer-for-contentでWC画像にリネーム"
    cmds:
      - task: image-rename:image-renamer:web-clip

  image-renamer:wine:
    desc: "image-renamer-for-contentでWI画像にリネーム"
    cmds:
      - task: image-rename:image-renamer:wine

  image-renamer:by-2-digits:
    desc: "image-renamerで2桁連番リネーム"
    cmds:
      - task: image-rename:image-renamer:by-2-digits

  image-renamer:by-4-digits:
    desc: "image-renamerで4桁連番リネーム"
    cmds:
      - task: image-rename:image-renamer:by-4-digits

  image-renamer:by-prefix:
    desc: "image-renamerで特定のディレクトリ内で接頭辞を使ったリネーム"
    cmds:
      - task: image-rename:image-renamer:by-prefix

  image-converter:jpg-to-webp:
    desc: "image-converterでJPGからWebPに変換"
    cmds:
      - task: image-convert:image-converter:jpg-to-webp

  image-converter:png-to-webp:
    desc: "image-converterでPNGからWebPに変換"
    cmds:
      - task: image-convert:image-converter:png-to-webp

  image-converter:png-to-webp-keeping-saturation:
    desc: "image-converterでPNGからWebP(lossless)に変換"
    cmds:
      - task: image-convert:image-converter:png-to-webp-keeping-saturation

  image-converter:to-jpg:
    desc: "image-converterでJPGへ変換"
    cmds:
      - task: image-convert:image-converter:to-jpg

  screenshot:rename-convert:
    desc: "スクショの命名＋WebP変換 (image-renamer-for-screenshot + image-converter)"
    cmds:
      - task: synthetic:screenshot:rename-convert
