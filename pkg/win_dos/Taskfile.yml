version: "3"

vars:
  CLI_BIN_DIR: "{{.TASKFILE_DIR}}\\pkg\\bin\\cli\\win_amd64"
  DIR_SEP: '{{if eq OS "windows"}}\{{else}}/{{end}}'

tasks:
  image-renamer:habit:
    desc: "image-renamer-for-content.exeでHB画像をリネーム"
    cmds:
      - cmd: |
          set -eu

          INTERACTIVE_BIN="{{.CLI_BIN_DIR}}{{.DIR_SEP}}interactive-input.exe"

          START_ARG="$($INTERACTIVE_BIN \
            --prompt "Input start of number for content of habit (HBxxxxxxxxx_01.webp): " \
            --input-type text --key start)" || exit 1

          SORT_SELECTION="$($INTERACTIVE_BIN \
            --prompt "Select how to sort image files to rename  [n]='--name'  [t]='--time' : " \
            --input-type choice --key sort-flag \
            --choice-option "n|--name" --choice-option "t|--time")" || exit 1

          if [ -z "$START_ARG" ] || [ -z "$SORT_SELECTION" ]; then
            echo "interactive-input から値を取得できませんでした。" >&2
            exit 1
          fi

          SORT_FLAG="${SORT_SELECTION#*=}"

          echo "--- 画像リネームプログラムを実行します ---"
          "{{.CLI_BIN_DIR}}{{.DIR_SEP}}image-renamer-for-content.exe" \
            -src . -operation habit \
            -delimiter "" -suffix "" \
            "$START_ARG" "$SORT_FLAG"
          echo
          echo "--- 画像リネームプログラムの実行が完了しました ---"
        dir: "{{.TASKFILE_DIR}}"
        interactive: true

  screenshot:rename-convert:
    desc: "スクショの命名＋WebP変換 (image-renamer-for-screenshot.exe + image-converter.exe)"
    cmds:
      - cmd: |
          set -eu

          INTERACTIVE_BIN="{{.CLI_BIN_DIR}}{{.DIR_SEP}}interactive-input.exe"

          METHOD_FLAG="$($INTERACTIVE_BIN \
            --prompt "Select how to rename image files  [v]='vlc'  [w]='win'  [x]='xiaomi'  [p]='pixel (screen_record)' : " \
            --input-type choice --key operation \
            --choice-option "v|vlc" --choice-option "w|win" --choice-option "x|xiaomi" --choice-option "p|pixel")" || exit 1

          if [ -z "$METHOD_FLAG" ]; then
            echo "interactive-input からリネーム方法を取得できませんでした。" >&2
            exit 1
          fi

          MOVE_FLAG="$($INTERACTIVE_BIN \
            --prompt "Select whether to move original image files to archive directory or not  [y]='--move'  [n]='' : " \
            --input-type confirm --key move)" || exit 1

          echo "--- 画像リネームプログラムを実行します ---"
          "{{.CLI_BIN_DIR}}{{.DIR_SEP}}image-renamer-for-screenshot.exe" -src . "${METHOD_FLAG}"
          echo
          echo "--- 画像リネームプログラムの実行が完了しました ---"

          echo "--- Webp変換プログラムを実行します ---"
          "{{.CLI_BIN_DIR}}{{.DIR_SEP}}image-converter.exe" \
            -src . -ext webp \
            -q 80  -archive .{{.DIR_SEP}}5_original_files \
            $MOVE_FLAG
          echo
          echo "--- Webp変換プログラムの実行が完了しました ---"
        dir: "{{.TASKFILE_DIR}}"
        interactive: true
