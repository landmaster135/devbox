version: "3"

includes:
  core:
    taskfile: ./Taskfile.core.yml
    internal: true

tasks:
  image-converter:jpg-to-webp:
    desc: "image-converterでJPGからWebPに変換"
    cmds:
      - cmd: |
          set -eu
          {{.INTERACTIVE_CONFIRM_INPUT}}

          MOVE_FLAG="$(input_confirm_interactively \
            "Select whether to move original image files to archive directory or not  [y]='--move'  [n]='' : " move)" || exit 1

          echo $'\n[Step 01: START]--- Webp変換プログラムを実行します ---'
          "{{.CLI_BIN_DIR}}{{.DIR_SEP}}image-converter{{.EXE}}" \
            --src . --ext webp --q 80 \
            --archive .{{.DIR_SEP}}5_original_files \
            $MOVE_FLAG
          echo $'\n[Step 01: END]--- Webp変換プログラムの実行が完了しました ---'
        dir: "{{.TASKFILE_DIR}}"
        interactive: true
        silent: true

  image-converter:png-to-webp:
    desc: "image-converterでPNGからWebPに変換"
    cmds:
      - cmd: |
          set -eu
          {{.INTERACTIVE_CONFIRM_INPUT}}

          MOVE_FLAG="$(input_confirm_interactively \
            "Select whether to move original image files to archive directory or not  [y]='--move'  [n]='' : " move)" || exit 1

          echo $'\n[Step 01: START]--- Webp変換プログラムを実行します ---'
          "{{.CLI_BIN_DIR}}{{.DIR_SEP}}image-converter{{.EXE}}" \
            --src . --ext webp --q 80 \
            --archive .{{.DIR_SEP}}5_original_files \
            $MOVE_FLAG
          echo $'\n[Step 01: END]--- Webp変換プログラムの実行が完了しました ---'
        dir: "{{.TASKFILE_DIR}}"
        interactive: true
        silent: true

  image-converter:png-to-webp-keeping-saturation:
    desc: "image-converterでPNGからWebP(lossless)に変換"
    cmds:
      - cmd: |
          set -eu
          {{.INTERACTIVE_CONFIRM_INPUT}}

          MOVE_FLAG="$(input_confirm_interactively \
            "Select whether to move original image files to archive directory or not  [y]='--move'  [n]='' : " move)" || exit 1

          echo $'\n[Step 01: START]--- Webp(lossless)変換プログラムを実行します ---'
          "{{.CLI_BIN_DIR}}{{.DIR_SEP}}image-converter{{.EXE}}" \
            --src . --ext webp --q 80 --lossless \
            --archive .{{.DIR_SEP}}5_original_files \
            $MOVE_FLAG
          echo $'\n[Step 01: END]--- Webp(lossless)変換プログラムの実行が完了しました ---'
        dir: "{{.TASKFILE_DIR}}"
        interactive: true
        silent: true

  image-converter:to-jpg:
    desc: "image-converterでJPGへ変換"
    cmds:
      - cmd: |
          set -eu
          {{.INTERACTIVE_TEXT_INPUT}} {{.INTERACTIVE_CONFIRM_INPUT}}

          QUALITY_ARG="$(input_text_interactively \
            "Input integer (75 as default) for quality of output jpg (1-100): " q)" || exit 1

          MOVE_FLAG="$(input_confirm_interactively \
            "Select whether to move original image files to archive directory or not  [y]='--move'  [n]='' : " move)" || exit 1

          echo $'\n[Step 01: START]--- JPG変換プログラムを実行します ---'
          "{{.CLI_BIN_DIR}}{{.DIR_SEP}}image-converter{{.EXE}}" \
            --src . --ext jpg \
            --archive .{{.DIR_SEP}}5_original_files \
            $QUALITY_ARG $MOVE_FLAG
          echo $'\n[Step 01: END]--- JPG変換プログラムの実行が完了しました ---'
        dir: "{{.TASKFILE_DIR}}"
        interactive: true
        silent: true
