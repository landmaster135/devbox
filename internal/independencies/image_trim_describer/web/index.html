<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画像トリミングツール</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <h1>画像トリミングツール</h1>

    <div class="image-selector">
      <h2>画像を選択</h2>
      <select id="imageSelector">
        <option value="">-- 画像を選択してください --</option>
      </select>
      <p>または</p>
      <input type="file" id="imageLoader" accept="image/*">
    </div>

    <div class="instructions">
      <p>使い方:</p>
      <ol>
        <li>画像を選択してください</li>
        <li>赤と青のバーを<strong>クリック</strong>して上部座標を設定</li>
        <li>黄と緑のバーを<strong>クリック</strong>して下部座標を設定</li>
        <li>「トリミング実行」ボタンをクリックして座標をコピー</li>
        <li>コピーされた座標を使用してコマンドラインでトリミングを実行</li>
      </ol>
    </div>

    <div id="imageView" style="position: relative; width: fit-content; margin: 20px auto;">
      <img id="imageElement" src="" alt="画像を選択してください">
      <!-- 上部X座標（赤） -->
      <div id="draggableBarXUpper" style="position: absolute; width: 5px; height: 100%; background-color: red; cursor: grab; left: 0; z-index: 1000;"></div>
      <!-- 上部Y座標（青） -->
      <div id="draggableBarYUpper" style="position: absolute; width: 100%; height: 5px; background-color: blue; cursor: grab; top: 0; z-index: 1000;"></div>
      <!-- 下部X座標（黄） -->
      <div id="draggableBarXLower" style="position: absolute; width: 5px; height: 100%; background-color: yellow; cursor: grab; left: 0; z-index: 1000;"></div>
      <!-- 下部Y座標（緑） -->
      <div id="draggableBarYLower" style="position: absolute; width: 100%; height: 5px; background-color: green; cursor: grab; top: 0; z-index: 1000;"></div>
    </div>

    <div class="coordinates-container">
      <div class="coordinate-group">
        <h3>上部座標</h3>
        <div class="coordinate-input">
          <label>X: </label>
          <input type="text" id="coordinateXUpperDisplay" readonly>
          <span>px</span>
        </div>
        <div class="coordinate-input">
          <label>Y: </label>
          <input type="text" id="coordinateYUpperDisplay" readonly>
          <span>px</span>
        </div>
      </div>

      <div class="coordinate-group">
        <h3>下部座標</h3>
        <div class="coordinate-input">
          <label>X: </label>
          <input type="text" id="coordinateXLowerDisplay" readonly>
          <span>px</span>
        </div>
        <div class="coordinate-input">
          <label>Y: </label>
          <input type="text" id="coordinateYLowerDisplay" readonly>
          <span>px</span>
        </div>
      </div>
    </div>

    <div class="clipboard-container">
      <h3>クリップボードの座標</h3>
      <input type="text" id="clipboardCoordinates" readonly>
      <p>※この座標をimage-trimmerコマンドで使用できます</p>
    </div>

    <div class="status-container">
      <p id="lockStatus"></p>
      <p id="copyStatus"></p>
    </div>

    <div class="actions">
      <button id="trimButton" disabled>トリミング実行（座標をコピー）</button>
      <button id="resetButton">リセット</button>
    </div>

    <div id="result" class="result-container"></div>
  </div>

  <script src="config.js"></script>
  <script src="script.js"></script>
</body>

</html>
