<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>画像トリミング座標プロットツール</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1>画像トリミング座標プロットツール</h1>
  </header>

  <main>
    <section class="instructions-section">
      <h2>使い方</h2>
      <ol class="instructions-list">
        <li>画像を選択してください</li>
        <li><span class="marker-red">赤</span>と<span class="marker-blue">青</span>のバーを<strong>クリック</strong>して上部座標を設定</li>
        <li><span class="marker-yellow">黄</span>と<span class="marker-green">緑</span>のバーを<strong>クリック</strong>して下部座標を設定</li>
        <li>「トリミング実行」ボタンをクリックして座標をコピー</li>
        <li>コピーされた座標を使用してコマンドラインでトリミングを実行</li>
      </ol>
    </section>

    <section class="image-upload-section">
      <label for="imageLoader" class="file-upload-label">画像を選択</label>
      <input type="file" id="imageLoader" accept="image/*" class="file-upload">
    </section>

    <section class="image-editor-section">
      <div id="imageView" class="image-container">
        <img id="imageElement" src="" alt="画像を選択してください" class="target-image">
        <!-- 上部座標用マーカー -->
        <div id="draggableBarXUpper" class="marker marker-vertical marker-red"></div>
        <div id="draggableBarYUpper" class="marker marker-horizontal marker-blue"></div>
        <!-- 下部座標用マーカー -->
        <div id="draggableBarXLower" class="marker marker-vertical marker-yellow"></div>
        <div id="draggableBarYLower" class="marker marker-horizontal marker-green"></div>
      </div>
    </section>

    <section class="coordinates-section">
      <div class="coordinates-panel">
        <h3>現在の座標</h3>

        <div class="coordinates-group">
          <h4>上部座標</h4>
          <div class="coordinate-row">
            <div class="coordinate-item">
              <label for="coordinateXUpperDisplay">X:</label>
              <input type="text" id="coordinateXUpperDisplay" readonly class="coordinate-input">
              <span id="coordinateXUpperUnit" class="coordinate-unit">px</span>
            </div>
            <div class="coordinate-item">
              <label for="coordinateYUpperDisplay">Y:</label>
              <input type="text" id="coordinateYUpperDisplay" readonly class="coordinate-input">
              <span id="coordinateYUpperUnit" class="coordinate-unit">px</span>
            </div>
          </div>
        </div>

        <div class="coordinates-group">
          <h4>下部座標</h4>
          <div class="coordinate-row">
            <div class="coordinate-item">
              <label for="coordinateXLowerDisplay">X:</label>
              <input type="text" id="coordinateXLowerDisplay" readonly class="coordinate-input">
              <span id="coordinateXLowerUnit" class="coordinate-unit">px</span>
            </div>
            <div class="coordinate-item">
              <label for="coordinateYLowerDisplay">Y:</label>
              <input type="text" id="coordinateYLowerDisplay" readonly class="coordinate-input">
              <span id="coordinateYLowerUnit" class="coordinate-unit">px</span>
            </div>
          </div>
        </div>

        <div id="lockStatus" class="status-message"></div>
      </div>

      <div class="coordinates-panel">
        <h3>記録用座標</h3>

        <div class="coordinates-group">
          <h4>上部座標</h4>
          <div class="coordinate-row">
            <div class="coordinate-item">
              <label for="coordinateXUpperDisplayToRecord">X:</label>
              <input type="text" id="coordinateXUpperDisplayToRecord" class="coordinate-input">
              <span id="coordinateXUnit" class="coordinate-unit">px</span>
            </div>
            <div class="coordinate-item">
              <label for="coordinateYUpperDisplayToRecord">Y:</label>
              <input type="text" id="coordinateYUpperDisplayToRecord" class="coordinate-input">
              <span id="coordinateYUnit" class="coordinate-unit">px</span>
            </div>
          </div>
        </div>

        <div class="coordinates-group">
          <h4>下部座標</h4>
          <div class="coordinate-row">
            <div class="coordinate-item">
              <label for="coordinateXLowerDisplayToRecord">X:</label>
              <input type="text" id="coordinateXLowerDisplayToRecord" class="coordinate-input">
              <span id="coordinateXUnit" class="coordinate-unit">px</span>
            </div>
            <div class="coordinate-item">
              <label for="coordinateYLowerDisplayToRecord">Y:</label>
              <input type="text" id="coordinateYLowerDisplayToRecord" class="coordinate-input">
              <span id="coordinateYUnit" class="coordinate-unit">px</span>
            </div>
          </div>
        </div>
      </div>

      <div class="clipboard-container">
        <h3>クリップボードの座標</h3>
        <div class="clipboard-row">
          <input type="text" id="clipboardCoordinates" readonly class="clipboard-input">
          <button id="copyButton" class="action-button">トリミング実行</button>
        </div>
        <p class="clipboard-note">※この座標をimage-trimmerコマンドで使用できます</p>
        <p id="copyToCb" class="status-message"></p>
      </div>
    </section>
  </main>

  <footer>
    <p>画像トリミング座標プロットツール © 2025</p>
  </footer>

  <script src="script.js"></script>
</body>

</html>
