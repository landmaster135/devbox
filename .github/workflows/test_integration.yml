name: go-test-integration

on:
  push:

permissions: write-all

env:
  GO_VERSION: "1.25"
  COV_FILE: "coverage.out"
  DOCS_FILE_FOR_SERVICE_IMPLEMENTATION_STATUS: "docs/project_status/service_implementation_status.md"
  GOOGLE_CLOUD_PROJECT_ID_01: "any-project"
  GCLOUD_PROJECT_NUMBER: ${{ secrets.GCLOUD_PROJECT_NUMBER }}
  GCLOUD_POOL_ID: ${{ secrets.GCLOUD_POOL_ID }}
  GCLOUD_PROVIDER_ID: ${{ secrets.GCLOUD_PROVIDER_ID }}
  GCLOUD_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GCLOUD_SERVICE_ACCOUNT_EMAIL }}

jobs:
  test:
    strategy:
      matrix:
        go-version: [1.25.x]
        os: [ubuntu-latest, macos-latest, windows-latest]
        exclude:
          # 特定の組み合わせを除外
          - os: windows-latest
          - os: macos-latest
        include:
          # Set additional parameters for a specific combination
          - os: ubuntu-latest
            coverage-badge: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Golang
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Check Go version
        run: go version
      - id: "gcloud_auth"
        name: "Authenticate to Google Cloud"
        uses: "google-github-actions/auth@v3"
        with:
          create_credentials_file: true
          workload_identity_provider: "projects/${{ env.GCLOUD_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/${{ env.GCLOUD_POOL_ID }}/providers/${{ env.GCLOUD_PROVIDER_ID }}"
          service_account: "${{ env.GCLOUD_SERVICE_ACCOUNT_EMAIL }}"
      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v3"
      - name: "Use gcloud CLI"
        run: "gcloud info"
      - name: Run Test
        run: |
          set -euo pipefail
          bash ./scripts/ops/ci/ci_test_with_logging.sh \
            --log-file="${{ github.workspace }}/.agents/tmp/go-test.log" \
            --go-version="${{ env.GO_VERSION }}" \
            --cov-file="${{ env.COV_FILE }}" \
            --image-tag="devbox-ci-test:${{ github.run_id }}-${{ github.run_attempt }}" \
            --run-context="github-actions"
      - name: Go Coverage Badge
        if: ${{ matrix.coverage-badge }}
        run: |
          go run ./cmd/cli/coverage-badge/main.go \
            -operation=patch-badge \
            -badge-title=coverage \
            -target-file=${{ github.workspace }}/README.md \
            -coverage-file=${{ env.COV_FILE }}
      - name: Update service implementation doc
        run: |
          go run ./cmd/cli/service-implementing-viewer/main.go \
            -operation=write \
            -root-dir=${{ github.workspace }}/cmd \
            -target-dirs=cli,mcp,grpc/handlers,http/handlers \
            -write-file=${{ env.DOCS_FILE_FOR_SERVICE_IMPLEMENTATION_STATUS }}
      - name: Push changes
        if: ${{ matrix.coverage-badge }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add README.md ${{ env.DOCS_FILE_FOR_SERVICE_IMPLEMENTATION_STATUS }}
          git log -1
          git diff --cached --quiet || (git commit -m "chore: Updated coverage badge [skip ci]" && git push origin HEAD)
